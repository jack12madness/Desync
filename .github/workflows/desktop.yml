name: Build Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      # Builds the NSIS installer AND publishes a GitHub Release (tag v<version>).
      # The release is what powers in-app auto-updates and the public download link:
      #   https://github.com/<owner>/<repo>/releases/latest/download/DesyncDesktop-Setup.exe
      # electron-builder picks up owner/repo from the GITHUB_REPOSITORY env var.
      - name: Build + publish installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesyncDesktop-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
